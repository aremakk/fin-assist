server:
  port: ${PORT:8080}

spring:
  application:
    name: budget-app
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:55432}/budget_app
    username: budget
    password: budget
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Override in production via APP_JWT_SECRET
    secret: ${APP_JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-32-bytes}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  gemini:
    enabled: true
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
