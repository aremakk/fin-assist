services:
  postgres:
    image: postgres:16-alpine
    container_name: budget-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: budget_app
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
    ports:
      - "5432:5432"
    volumes:
      - budget_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  budget_pg_data:
